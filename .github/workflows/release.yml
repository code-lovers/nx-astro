name: Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['packages/nx-astro--release_created'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Enable corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # No dependency cache in the job that publishes, so a poisoned cache
      # cannot change the package.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test and build
        run: pnpm nx run-many -t test build -p nx-astro
      - name: Check the package
        run: pnpm check:package
      # npm trusted publishing: pnpm exchanges the OIDC token of this job for a
      # short-lived npm token, so the repository stores no npm token.
      - name: Publish to npm
        working-directory: packages/nx-astro
        run: pnpm publish --provenance --access public --no-git-checks
