name: Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['packages/nx-astro--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages/nx-astro--tag_name'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # Adds the people who wrote the commits of the release to its notes, and
  # names the first-time contributors that GitHub finds.
  thank-contributors:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Add the contributors to the release notes
        run: |
          set -euo pipefail
          body=$(gh release view "$TAG" --json body --jq .body)
          if grep -q '^#### Committers' <<<"$body"; then
            echo "The notes of $TAG already list the committers."
            exit 0
          fi
          # The list is newest first, so the second entry is the previous release.
          previous=$(gh release list --exclude-drafts --limit 2 --json tagName --jq '.[1].tagName // empty')
          if [ -z "$previous" ]; then
            echo "$TAG is the first release. There is no range to read."
            exit 0
          fi

          logins=$(gh api "repos/$GH_REPO/compare/$previous...$TAG" --paginate \
            --jq '.commits[] | select(.author != null and .author.type != "Bot") | .author.login' | sort -fu)
          if [ -z "$logins" ]; then
            echo "No commit in $previous...$TAG has a GitHub author."
            exit 0
          fi

          section="#### Committers: $(wc -l <<<"$logins" | tr -d ' ')"$'\n'
          while read -r login; do
            name=$(gh api "users/$login" --jq '.name // .login')
            section+="- $name ([@$login](https://github.com/$login))"$'\n'
          done <<<"$logins"

          newcomers=$(gh api -X POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$TAG" -f previous_tag_name="$previous" --jq .body |
            sed -n 's/^\* @\([^ ]*\) made their first contribution in \(.*\)$/- [@\1](https:\/\/github.com\/\1) made their first contribution in \2/p' |
            grep -v '\[bot\]' || true)
          if [ -n "$newcomers" ]; then
            section+=$'\n'"#### New contributors"$'\n'"$newcomers"$'\n'
          fi

          printf '%s\n\n%s' "$body" "$section" > notes.md
          gh release edit "$TAG" --notes-file notes.md

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Enable corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # No dependency cache in the job that publishes, so a poisoned cache
      # cannot change the package.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test and build
        run: pnpm nx run-many -t test build -p nx-astro
      - name: Check the package
        run: pnpm check:package
      # npm 11.20 is the first release with `npm stage`.
      - name: Install npm with staged publishing
        run: npm install --global npm@11.20.0 # zizmor: ignore[adhoc-packages] exact version, no cache in this job
      # npm trusted publishing: npm exchanges the OIDC token of this job for a
      # short-lived token, so the repository stores no npm token. The token can
      # only stage the version. A maintainer approves it with 2FA.
      # pnpm added the root LICENSE to the package, npm does not.
      - name: Stage the version on npm
        working-directory: packages/nx-astro
        run: |
          cp ../../LICENSE LICENSE
          npm stage publish --provenance --access public
