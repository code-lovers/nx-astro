name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0
      - name: Enable corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      - name: Check formatting
        run: pnpm exec prettier --check .
      - name: Lint, test, build and typecheck
        run: pnpm nx affected -t lint test build typecheck --exclude=nx-astro-e2e
      - name: Check the package and unused code
        run: |
          pnpm nx build nx-astro
          pnpm check:package
          pnpm exec knip
      # The e2e publishes the plugin to a local registry and creates a new Nx
      # workspace with it, so it runs after the other targets pass.
      - name: e2e
        run: pnpm nx affected -t e2e
        env:
          NX_DAEMON: 'false'
