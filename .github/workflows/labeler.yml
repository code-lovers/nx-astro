name: PR Labeler

# pull_request_target gives the token write access on PRs from forks. The job
# never checks out the PR code, so the PR cannot run code with that token.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]

jobs:
  labeler:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
