name: Preview package

# Publishes the plugin of each PR to pkg.pr.new, so you can try it with
# `nx add` before the release. GitHub gives no OIDC token to PRs from forks,
# so the job runs only for branches of this repository.
on:
  pull_request:

permissions: {}

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Enable corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm nx build nx-astro
      - name: Publish the preview
        run: pnpm exec pkg-pr-new publish --pnpm --previewVersion --commentWithSha './packages/nx-astro'
